# Minimal SonarScanner configuration.
#
# Copy this file into the ROOT of the project you want to scan, then run:
#   sonar-scanner -Dsonar.token=<your-token>
# (generate the token in the SonarQube UI: My Account > Security > Generate Tokens,
#  or during the "Create Project > Locally" wizard.)
#
# Tip: instead of passing -Dsonar.token every time, set it once per terminal:
#   export SONAR_TOKEN=<your-token>    # Linux/macOS
#   $env:SONAR_TOKEN="<your-token>"    # Windows PowerShell

# A unique id SonarQube uses to track this project over time.
sonar.projectKey=Project1

# Your SonarQube authentication token (replace YOUR_TOKEN_HERE with your actual token)
sonar.token=sqp_c99557d0b84418c5a6a12b145d41da77981ac068


# The display name shown on the dashboard.
sonar.projectName=Project1

# Where your source code lives, relative to this file ("." = current folder).
sonar.sources=app,src,backend/src,App.tsx

# The local server started by docker compose.
sonar.host.url=http://localhost:9000

# Optional: skip generated/vendored code, e.g.
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.min.js,.expo/**
