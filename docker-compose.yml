services:
  # =========================================================================
  # 1. RELATIONAL DATABASE (MariaDB 11.4)
  # =========================================================================
  mariadb:
    image: mariadb:11.4
    container_name: techtune_mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_NAME:-techtune_db}
      MYSQL_USER: ${DB_USER:-techtune_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-techtune_pass}
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - techtune_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # 2. BACKEND API GATEWAY & REAL-TIME WEBSOCKET SERVER
  # =========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techtune_backend
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: mysql://${DB_USER:-techtune_user}:${DB_PASSWORD:-techtune_pass}@mariadb:3306/${DB_NAME:-techtune_db}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_2026}
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"
    networks:
      - techtune_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # =========================================================================
  # 3. ADMIN OPERATIONS WEB PORTAL (Next.js 16)
  # =========================================================================
  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
    container_name: techtune_admin_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: 3000
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000
    ports:
      - "3000:3000"
    networks:
      - techtune_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  mariadb_data:
    driver: local

networks:
  techtune_network:
    driver: bridge
