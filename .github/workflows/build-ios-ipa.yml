name: Build iOS Sideloadable IPA

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as a GitHub Release (direct link)'
        required: false
        type: boolean
        default: true

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (ARM64 Physical Device)
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          sudo xcodebuild -license accept

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo Prebuild (Generate iOS Native Project)
        run: npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        run: |
          cd ios
          pod install

      - name: Build Unsigned App for Physical Device (ARM64)
        run: |
          WORKSPACE=$(find ios -name "*.xcworkspace" | head -n 1)
          SCHEME=$(xcodebuild -workspace "$WORKSPACE" -list -json | jq -r '.workspace.schemes[0]')
          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"

          # 1. Build Pods first to generate all Expo module maps
          echo "=== 1. Compiling Pods Frameworks ==="
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "Pods-$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build || true

          # 2. Compile main app with module maps ready
          echo "=== 2. Compiling Main App ==="
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package Payload into IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find ~/Library/Developer/Xcode/DerivedData -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "*.app" -path "*/Release-iphoneos/*" | head -n 1)
          fi
          echo "Packaging application from: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r TechTuneHealer-sideload.ipa Payload
          ls -lh TechTuneHealer-sideload.ipa

      - name: Upload IPA as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TechTuneHealer-sideload-ipa
          path: TechTuneHealer-sideload.ipa
          retention-days: 7

      - name: Create GitHub Release with IPA Download
        if: ${{ github.event.inputs.create_release != 'false' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sideload-v1.0.0-${{ github.run_number }}
          name: "TechTune Healer Sideload IPA (Build #${{ github.run_number }})"
          body: |
            ### 📱 TechTune Healer iOS IPA (Physical Device)
            This `.ipa` is compiled for physical iPhone hardware (`arm64` / `iphoneos`).
            
            #### 🛠 How to Install with Sideloadly:
            1. Download `TechTuneHealer-sideload.ipa` below.
            2. Connect your iPhone to your PC via USB and open **Sideloadly**.
            3. Drag and drop `TechTuneHealer-sideload.ipa` into Sideloadly.
            4. Enter your personal Apple ID (free) and click **Start**.
            5. On your iPhone: Go to **Settings > General > VPN & Device Management** and trust your certificate.
          files: TechTuneHealer-sideload.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
