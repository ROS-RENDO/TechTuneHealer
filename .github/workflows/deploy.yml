name: TechTune Healer CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'Deployment Environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io

jobs:
  # =========================================================================
  # 1. DOCKER CONTAINERIZATION & REGISTRY PUBLISH
  # =========================================================================
  build-and-push-images:
    name: Build & Push Docker Containers
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Lowercase Image Names
        run: |
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${REPO_LOWER}/backend" >> $GITHUB_ENV
          echo "ADMIN_IMAGE=ghcr.io/${REPO_LOWER}/admin-web" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build Backend Image
      - name: Build & Push Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Build Admin Web Image
      - name: Build & Push Admin Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./admin-web
          file: ./admin-web/Dockerfile
          push: true
          tags: |
            ${{ env.ADMIN_IMAGE }}:latest
            ${{ env.ADMIN_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================================================
  # 2. AUTOMATED SERVER DEPLOYMENT (SSH / Docker Compose)
  # =========================================================================
  deploy-server:
    name: Deploy to Cloud Infrastructure
    needs: build-and-push-images
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    env:
      SSH_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to VPS
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd /opt/techtune-healer || exit 1
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f

      - name: VPS Deployment Notice
        if: env.SSH_HOST == ''
        run: echo "SERVER_HOST secret not configured. Container images published to GHCR successfully."

  # =========================================================================
  # 3. EXPO EAS MOBILE BUILD (Triggered on Release Tags)
  # =========================================================================
  eas-build-mobile:
    name: Expo EAS Mobile Build (Android & iOS)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Expo EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Standalone Mobile Artifacts
        run: |
          eas build --platform all --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
